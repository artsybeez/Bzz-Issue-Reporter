<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Bleta's Issue Reporter</title>
    <script>
        (function () {
            const INTRO_SEEN_KEY = 'bzz_seen_intro';
            try {
                const params = new URLSearchParams(window.location.search);
                const fromIntro = params.get('fromIntro') === '1';
                const skipIntro = params.get('skipIntro') === '1';

                if (fromIntro || skipIntro) return;

                const seenIntro = localStorage.getItem(INTRO_SEEN_KEY) === 'true';
                if (!seenIntro) {
                    window.location.replace('intro.html');
                }
            } catch (e) {
                // If localStorage is blocked/unavailable, do not redirect.
            }
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.6s ease-out',
                        'slide-up': 'slideUp 0.5s ease-out',
                        'pulse-soft': 'pulseSoft 2s infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        pulseSoft: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.7' },
                        },
                    },
                },
            },
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 transition-colors duration-300">
    <!-- Ambient Background -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- Header -->
    <header class="sticky top-0 z-50">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="mt-4 glass-card rounded-2xl px-6 py-4 animate-fade-in">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="relative group">
                            <div class="absolute inset-0 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-xl blur opacity-40 group-hover:opacity-60 transition-opacity"></div>
                            <img src="https://png.pngtree.com/png-clipart/20250307/original/pngtree-dog-wearing-glasses-and-looking-smart-png-image_20595001.png" 
                                 alt="Bleta's Logo" 
                                 class="relative w-10 h-10 rounded-xl object-cover border-2 border-white/20">
                        </div>
                        <h1 class="text-lg font-semibold tracking-tight">
                            <span class="hidden sm:inline">Bleta's Issue Reporter</span>
                            <span class="sm:hidden">Issue Reporter</span>
                        </h1>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="toggleForm()" 
                                class="btn-primary px-4 py-2.5 rounded-xl text-white font-medium flex items-center gap-2 text-sm">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            <span id="toggleText">New Issue</span>
                        </button>
                        <button onclick="toggleDarkMode()" 
                                class="p-2.5 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all duration-200"
                                aria-label="Toggle dark mode">
                            <i data-lucide="moon" class="w-5 h-5 hidden dark:block text-amber-400"></i>
                            <i data-lucide="sun" class="w-5 h-5 block dark:hidden text-orange-500"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8">
        <!-- Hero Section -->
        <div class="text-center mb-8 animate-slide-up">
            <p class="text-sm font-medium text-indigo-600 dark:text-indigo-400 uppercase tracking-wider mb-2">Dashboard</p>
            <h2 class="text-3xl sm:text-4xl font-bold tracking-tight mb-3">
                <span class="gradient-text">Track & manage</span> your issues
            </h2>
            <p class="text-gray-600 dark:text-gray-400 max-w-2xl mx-auto">
                Report any issue regarding code or even device problems!
            </p>
        </div>

        <!-- Issue Submission Form -->
        <div id="formCard" class="hidden mb-8 animate-slide-up">
            <div class="glass-card rounded-3xl p-6 sm:p-8">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-2xl font-bold">Submit New Issue</h3>
                    <button onclick="toggleForm()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                
                <form id="issueForm" onsubmit="handleSubmit(event)" class="space-y-6">
                    <!-- Issue Title -->
                    <div>
                        <label for="title" class="block text-sm font-medium mb-2">Issue Title</label>
                        <input 
                            type="text" 
                            id="title" 
                            placeholder="Brief description of the issue..."
                            required
                            class="w-full px-4 py-3 rounded-xl bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all"
                        >
                    </div>

                    <!-- Description -->
                    <div>
                        <label for="description" class="block text-sm font-medium mb-2">Description</label>
                        <textarea 
                            id="description" 
                            placeholder="Provide more details about the issue..."
                            required
                            rows="4"
                            class="w-full px-4 py-3 rounded-xl bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all resize-none"
                        ></textarea>
                    </div>

                    <!-- Category and File Upload Row -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <!-- Category -->
                        <div>
                            <label for="category" class="block text-sm font-medium mb-2">Category</label>
                            <select id="category" class="w-full px-4 py-3 rounded-xl bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all">
                                <option value="Bug">Bug</option>
                                <option value="Feature Request">Feature Request</option>
                                <option value="UI Issue">UI Issue</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <!-- File Upload -->
                        <div>
                            <label for="file" class="block text-sm font-medium mb-2">
                                Attachment <span class="text-gray-500 text-xs">(optional)</span>
                            </label>
                            <input type="file" id="file" onchange="handleFileChange(event)">
                            <label for="file" class="file-upload-label">
                                <i data-lucide="paperclip" class="w-4 h-4"></i>
                                <span id="fileLabel">Upload file</span>
                            </label>
                        </div>
                    </div>

                    <!-- Priority Selector -->
                    <div>
                        <label class="block text-sm font-medium mb-3">Priority</label>
                        <div class="priority-selector flex gap-3">
                            <button 
                                type="button" 
                                class="flex-1 px-4 py-3 rounded-xl font-medium priority-low" 
                                onclick="setPriority('low')"
                            >
                                Low
                            </button>
                            <button 
                                type="button" 
                                class="flex-1 px-4 py-3 rounded-xl font-medium priority-medium active" 
                                onclick="setPriority('medium')"
                            >
                                Medium
                            </button>
                            <button 
                                type="button" 
                                class="flex-1 px-4 py-3 rounded-xl font-medium priority-high" 
                                onclick="setPriority('high')"
                            >
                                High
                            </button>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-primary w-full px-6 py-4 rounded-xl text-white font-semibold flex items-center justify-center gap-3">
                        <i data-lucide="send" class="w-5 h-5"></i>
                        <span>Submit Issue</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- Issues List Section -->
        <div class="animate-slide-up" style="animation-delay: 0.1s;">
            <!-- Combined Issues Header & Filters -->
            <div class="glass-card rounded-2xl px-6 py-5 mb-6">
                <!-- Header -->
                <div class="flex items-center justify-between mb-5">
                    <h3 class="text-xl font-bold">All Issues</h3>
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse-soft"></div>
                        <span id="issueCount" class="text-sm font-medium text-gray-600 dark:text-gray-400">0 issues</span>
                    </div>
                </div>

                <!-- Filters -->
                <div class="border-t border-gray-200 dark:border-gray-700 pt-5">
                    <div class="flex items-center gap-2 mb-4">
                        <i data-lucide="filter" class="w-4 h-4 text-indigo-600 dark:text-indigo-400"></i>
                        <span class="text-sm font-medium">Filters</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label for="filterPriority" class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-2">Priority</label>
                            <select id="filterPriority" onchange="applyFilters()" class="w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm outline-none focus:border-indigo-500 transition-colors">
                                <option value="">All</option>
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                        <div>
                            <label for="filterCategory" class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-2">Category</label>
                            <select id="filterCategory" onchange="applyFilters()" class="w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm outline-none focus:border-indigo-500 transition-colors">
                                <option value="">All</option>
                                <option value="Bug">Bug</option>
                                <option value="Feature Request">Feature Request</option>
                                <option value="UI Issue">UI Issue</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div>
                            <label for="filterStatus" class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-2">Status</label>
                            <select id="filterStatus" onchange="applyFilters()" class="w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm outline-none focus:border-indigo-500 transition-colors">
                                <option value="">All</option>
                                <option value="open">Open</option>
                                <option value="in-progress">In Progress</option>
                                <option value="resolved">Resolved</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Issues List -->
            <div id="issuesList" class="space-y-4">
                <!-- Issues will be dynamically added here!! :D -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="glass-card rounded-3xl p-12 text-center">
                <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-gradient-to-br from-indigo-100 to-purple-100 dark:from-indigo-900/30 dark:to-purple-900/30 flex items-center justify-center">
                    <i data-lucide="inbox" class="w-8 h-8 text-indigo-600 dark:text-indigo-400"></i>
                </div>
                <h4 class="text-lg font-semibold mb-2">No issues yet</h4>
                <p class="text-gray-600 dark:text-gray-400 mb-6">Get started by creating your first issue report</p>
                <button onclick="toggleForm()" class="btn-primary px-6 py-3 rounded-xl text-white font-medium inline-flex items-center gap-2">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>Create Issue</span>
                </button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
